[build]
  # command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Puppeteer (used for build-time pre-rendering) caches Chrome here
  PUPPETEER_CACHE_DIR = "/opt/build/cache/.puppeteer"

[functions]
  directory = "netlify/functions"

# Retry pending Brevo contact upserts. The function calls the service-only
# Supabase worker with EMAIL_SYNC_WORKER_SECRET; it does not contain provider
# credentials itself.
[functions."email-sync-scheduler"]
  schedule = "*/15 * * * *"

# Claims only explicitly released, consented lifecycle events. The Supabase
# worker returns a zero-job audit response until COMMERCE_LIFECYCLE_MODE is
# deliberately changed to publish after the full Shopify/Brevo QA matrix.
[functions."commerce-sync-scheduler"]
  schedule = "*/5 * * * *"

# Reviews are rendered into static HTML for SEO and zero-CLS delivery. Refresh
# the Judge.me snapshot once daily at 09:17 UTC (early morning Mountain Time)
# by triggering a production build through a write-only Netlify build hook.
[functions."review-refresh-scheduler"]
  schedule = "17 9 * * *"


# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — subdirectory assets (immutable, 1 year)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — root-level (OG images, logo etc.)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML pages — edge cache with background revalidation
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600, stale-while-revalidate=86400"

# www → apex redirect (Netlify auto-handles HTTP→HTTPS)
[[redirects]]
  from = "https://www.baselayerskin.co/*"
  to = "https://baselayerskin.co/:splat"
  status = 301
  force = true

# Noindex for checkout path (belt-and-suspenders with client-side meta)
[[headers]]
  for = "/checkout"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net https://*.google-analytics.com https://*.googletagmanager.com https://cdn.brevo.com https://sibautomation.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.facebook.com https://*.google-analytics.com https://*.googletagmanager.com https://*.sanity.io https://judgeme.imgix.net https://cdn.judge.me https://review-images.judgeme.com https://*.brevo.com https://sibautomation.com https://*.sibautomation.com; connect-src 'self' https://base-layer-skin.myshopify.com https://*.facebook.com https://*.google-analytics.com https://*.googletagmanager.com https://*.supabase.co https://*.baselayerskin.co https://*.sanity.io https://*.brevo.com https://sibautomation.com https://*.sibautomation.com; frame-src 'none'"
